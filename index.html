<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Hub</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-title">通知ハブ</div>
        <div class="section-title">接続中のアプリ</div>
        <div class="app-list" id="appList"></div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <!-- HEADER -->
        <div class="header">
          <h1>通知センター</h1>
          <p>
            すべてのプラットフォームからの通知を一か所でまとめて確認できます。
          </p>
        </div>

        <!-- FILTER CONTROLS -->
        <div class="controls-container">
          <!-- STATUS FILTER -->
          <div class="filter-group">
            <button class="filter-btn active" data-status="all">すべて</button>
            <button class="filter-btn" data-status="unread">未読</button>
          </div>

          <!-- APP FILTER -->
          <div class="app-filter-group" id="appFilters"></div>
        </div>

        <!-- NOTIFICATIONS -->
        <div id="notificationsContainer"></div>
      </main>
    </div>

    <!-- CUSTOM MODAL POP-UP (削除確認) -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal-box">
        <div class="modal-header">
          <h3>削除の確認</h3>
        </div>
        <div class="modal-body">
          この通知を削除してもよろしいですか？この操作は元に戻せません。
        </div>
        <div class="modal-footer">
          <button class="modal-btn btn-cancel" id="btnCancelDelete">キャンセル</button>
          <button class="modal-btn btn-confirm" id="btnConfirmDelete">
            今すぐ削除
          </button>
        </div>
      </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal-box detail-modal-box">
        <div class="modal-header">
          <div>
            <span id="detailBadge" class="badge">Teams</span>
            <h3 id="detailSender">送信者</h3>
          </div>

          <button class="close-detail-btn" id="closeDetailModal">✕</button>
        </div>

        <div class="modal-body detail-body">
          <h4 id="detailSubject"></h4>

          <p id="detailMessage"></p>

          <div class="detail-meta">
            <span id="detailTime"></span>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
